[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-policy-llm"
version = "0.1.0"
description = "Learn short prompt policies that steer frozen frontier models."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.99"]
adaptgym = ["openai>=1.99", "python-dotenv>=1", "torch", "transformers>=4.51"]
controller = ["torch", "transformers>=4.48"]
local-hints = ["torch", "transformers>=4.55"]
train = ["accelerate>=0.34", "torch", "transformers>=4.48"]
dev = ["pytest>=8"]
all = ["accelerate>=0.34", "openai>=1.99", "torch", "transformers>=4.55", "pytest>=8"]

[project.scripts]
eval-omnimath = "prompt_policy_llm.eval_omnimath:main"
train-controller = "prompt_policy_llm.train_controller:main"
compare-policy = "prompt_policy_llm.compare_policy:main"
render-traces = "prompt_policy_llm.traces:main"
generate-teacher-hints = "prompt_policy_llm.teacher_hints:main"
compare-critic-oracle = "prompt_policy_llm.critic_oracle:main"

eval-adaptgym-pilot = "prompt_policy_llm.adaptgym_pilot:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
