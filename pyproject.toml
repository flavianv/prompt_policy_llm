[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-policy-llm"
version = "0.1.0"
description = "Learn short prompt policies that steer frozen frontier models."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["openai>=1.99"]
controller = ["torch", "transformers>=4.48"]
train = ["accelerate>=0.34", "torch", "transformers>=4.48"]
dev = ["pytest>=8"]
all = ["accelerate>=0.34", "openai>=1.99", "torch", "transformers>=4.48", "pytest>=8"]

[project.scripts]
eval-omnimath = "prompt_policy_llm.eval_omnimath:main"
train-controller = "prompt_policy_llm.train_controller:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
